plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Keystore rilis opsional: salin android/key.properties.example menjadi
// android/key.properties (di-gitignore). Tanpa berkas itu, build rilis memakai
// kunci debug sehingga siapa pun tetap bisa membangun APK dari source.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "id.dwiky.transpadang_live"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "id.dwiky.transpadang_live"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ?
                    signingConfigs.release : signingConfigs.debug
            // R8: perkecil APK dengan menghapus kode & resource yang tak terpakai.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            shrinkResources true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.gms:play-services-wearable:18.1.0"
    // Pairing & koneksi ADB over Wi-Fi (Android 11+) untuk memasang app Wear OS.
    implementation "com.github.MuntashirAkon:libadb-android:3.1.1"
    implementation "org.conscrypt:conscrypt-android:2.5.3"
    implementation "org.bouncycastle:bcpkix-jdk15to18:1.81"
    testImplementation "junit:junit:4.13.2"
}
