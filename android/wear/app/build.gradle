plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

// Tanda tangan HARUS sama dengan app ponsel agar Wearable Data Layer
// mengizinkan keduanya bertukar data (applicationId & signing cert identik).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('../key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "id.dwiky.transpadang_live"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        applicationId "id.dwiky.transpadang_live"
        minSdkVersion 30
        targetSdkVersion 35
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file("../../app/" + keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ?
                    signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.wear:wear-ongoing:1.1.0"
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.wear.compose:compose-material3:1.5.6"
    implementation "androidx.wear.compose:compose-foundation:1.5.6"
    implementation "androidx.wear.compose:compose-navigation:1.5.6"
    implementation "androidx.compose.material:material-icons-core:1.7.8"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.0"
}
