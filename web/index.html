<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Nilai base href diganti oleh argumen `--base-href` pada `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lacak posisi bus TransPadang secara real-time, cari rute, dan lihat estimasi kedatangan. Aplikasi tidak resmi, bukan bagian dari Pemerintah Kota Padang.">
  <meta name="theme-color" content="#F47F38">

  <meta property="og:title" content="TPLive — Lacak Bus TransPadang">
  <meta property="og:description" content="Posisi bus TransPadang real-time, pencarian rute, dan estimasi kedatangan.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TPLive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TPLive — Lacak Bus TransPadang</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    @media (prefers-color-scheme: dark) { html, body { background: #201A17; } }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, sans-serif; color: #6b5d55;
    }
    #boot img { width: 96px; height: 96px; border-radius: 24px; }
    #boot .bar {
      width: 140px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(244, 127, 56, .25);
    }
    #boot .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #F47F38; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
  </style>

  <script>
    // Nilai di bawah disisipkan oleh flutter build, jangan diubah.
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="boot" role="status" aria-label="Memuat TPLive">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            return appRunner.runApp();
          }).then(function () {
            var boot = document.getElementById('boot');
            if (boot) boot.remove();
          });
        }
      });
    });
  </script>
</body>
</html>
